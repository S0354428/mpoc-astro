  intro: "MPOC exists to prepare Mercer students for service, research, and leadership in the prosthetics and orthotics field — on campus and in Vietnam."

pillars:
  - title: "Lab volunteering"
    body: "Work alongside the prosthetics and orthotics lab to learn how devices are actually fabricated, from measurement to fitting."
  - title: "Fundraising"
    body: "On-campus events and the Mercer on Mission Vietnam Fundraising Dinner, run with the Mercer Vietnamese Student Association, fund patient care directly."
  - title: "Vietnamese & clinical training"
    body: "Executive board members lead language lessons and clinical training sessions to prepare students for the trip and the work."
  - title: "Leadership"
    body: "Grow into a lab supervisor role or a lesson/training lead — real responsibility, not just membership."

